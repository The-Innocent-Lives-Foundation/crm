name: Deploy CRM

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: crm-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Show commit
        run: |
          echo "Deploying: ${{ github.sha }}"
          git log -1 --oneline

      - name: Deploy to server
        env:
          FUNRAISE_WORKSPACE_ID: ${{ secrets.FUNRAISE_WORKSPACE_ID }}
          FUNRAISE_ORG_ID: ${{ secrets.FUNRAISE_ORG_ID }}
          FUNRAISE_API_KEY: ${{ secrets.FUNRAISE_API_KEY }}
          FUNRAISE_WEBHOOK_SIGNING_SECRET: ${{ secrets.FUNRAISE_WEBHOOK_SIGNING_SECRET }}
          FUNRAISE_API_BASE_URL: ${{ secrets.FUNRAISE_API_BASE_URL }}
          FUNRAISE_OPPORTUNITY_STAGE_WON: ${{ secrets.FUNRAISE_OPPORTUNITY_STAGE_WON }}
          FUNRAISE_OPPORTUNITY_STAGE_OPEN: ${{ secrets.FUNRAISE_OPPORTUNITY_STAGE_OPEN }}
        run: |
          chmod +x deploy.sh
          ./deploy.sh

      - name: Report
        run: echo "Deploy finished for ${{ github.sha }}"
